<!-- uvicorn app.main:app --reload -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Resume Job Matcher</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #222; padding: 2rem; }
    h1 { font-size: 1.4rem; margin-bottom: 1.5rem; }

    form { background: #fff; padding: 1.5rem; border-radius: 8px; max-width: 700px; display: flex; flex-direction: column; gap: 1rem; }
    label { font-size: 0.85rem; font-weight: 600; display: flex; flex-direction: column; gap: 0.3rem; }
    textarea { resize: vertical; padding: 0.5rem; font-size: 0.9rem; border: 1px solid #ccc; border-radius: 4px; min-height: 180px; }
    input[type=number], select { padding: 0.4rem; font-size: 0.9rem; border: 1px solid #ccc; border-radius: 4px; width: 120px; }
    .row { display: flex; gap: 1.5rem; flex-wrap: wrap; }
    button { align-self: flex-start; padding: 0.5rem 1.4rem; background: #2563eb; color: #fff; border: none; border-radius: 4px; font-size: 0.95rem; cursor: pointer; }
    button:disabled { background: #93b4f5; cursor: not-allowed; }

    #status { margin-top: 1rem; font-size: 0.9rem; color: #555; max-width: 700px; }
    #error { margin-top: 1rem; color: #b91c1c; font-size: 0.9rem; max-width: 700px; }

    #results { margin-top: 1.5rem; max-width: 700px; display: flex; flex-direction: column; gap: 1rem; }

    .card { background: #fff; border-radius: 8px; padding: 1.2rem; border-left: 4px solid #2563eb; }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }
    .card-title { font-size: 1rem; font-weight: 600; }
    .card-company { font-size: 0.85rem; color: #555; margin-top: 0.2rem; }
    .card-score { font-size: 0.8rem; color: #888; white-space: nowrap; }
    .card-url { margin-top: 0.5rem; font-size: 0.85rem; }
    .card-url a { color: #2563eb; text-decoration: none; }
    .card-url a:hover { text-decoration: underline; }
    .card-explanation { margin-top: 0.8rem; font-size: 0.88rem; line-height: 1.5; color: #333; }
    .corpus-warning { margin-top: 0.5rem; font-size: 0.8rem; color: #b45309; background: #fef3c7; padding: 0.3rem 0.6rem; border-radius: 4px; display: inline-block; }

    .compact { background: #fff; border-radius: 6px; padding: 0.75rem 1rem; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
    .compact-title { font-weight: 600; font-size: 0.9rem; }
    .compact-company { font-size: 0.85rem; color: #555; }
    .compact-url a { font-size: 0.85rem; color: #2563eb; text-decoration: none; }
    .compact-url a:hover { text-decoration: underline; }
    .compact-sep { color: #ccc; }

    .section-label { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #888; margin-top: 0.5rem; margin-bottom: -0.3rem; }
  </style>
</head>
<body>
  <h1>Resume Job Matcher</h1>

  <form id="form">
    <label>
      Resume
      <textarea id="resume" placeholder="Paste your resume here..." required>Built an LLM-powered semantic search engine using dense embeddings, cross-encoder reranking, and hybrid retrieval; validated with a synthetic evaluation framework

Trained an unsupervised anomaly detection model using neural networks and clustering in PyTorch and Scikit-learn, applied to high-dimensional, large data  to automate quality control, eliminating 2–3+ hours of manual review.

Built an LLM-powered conversational agent using prompt engineering, context management, and LLM output post-processing via the OpenAI API; delivered production-grade Python and Flask REST API backen

Developed a preprocessing pipeline chunking variable-length time-series recordings into fixed-interval 2D spectrograms to train a PyTorch CNN classifier, improving evaluation metrics</textarea>
    </label>

    <div class="row">
      <label>
        Min Education
        <select id="education">
          <option value="">None</option>
          <option value="BS">BS</option>
          <option value="MS">MS</option>
          <option value="PhD">PhD</option>
        </select>
      </label>

      <label>
        Years of Experience
        <input type="number" id="yoe" min="0" placeholder="Any">
      </label>

      <label>
        Role Type
        <select id="internship">
          <option value="">No preference</option>
          <option value="false">Full-time only</option>
          <option value="true">Internships only</option>
        </select>
      </label>

      <label>
        Top K
        <input type="number" id="top_k" min="1" value="10">
      </label>

      <label>
        Explain Top K
        <input type="number" id="explain_top_k" min="0" value="3">
      </label>
    </div>

    <button type="submit" id="submit-btn">Find Matches</button>
  </form>

  <div id="status"></div>
  <div id="error"></div>
  <div id="results"></div>

  <script>
    const form = document.getElementById('form');
    const statusEl = document.getElementById('status');
    const errorEl = document.getElementById('error');
    const resultsEl = document.getElementById('results');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.textContent = '';
      resultsEl.innerHTML = '';
      statusEl.textContent = 'Matching…';
      submitBtn.disabled = true;

      const top_k = parseInt(document.getElementById('top_k').value) || 10;
      const explain_top_k = parseInt(document.getElementById('explain_top_k').value);
      const yoeVal = document.getElementById('yoe').value;
      const educationVal = document.getElementById('education').value;
      const internshipVal = document.getElementById('internship').value;

      const body = {
        resume: document.getElementById('resume').value,
        top_k,
        explain_top_k: isNaN(explain_top_k) ? top_k : explain_top_k,
      };
      if (educationVal) body.education = educationVal;
      if (yoeVal !== '') body.years_of_experience = parseInt(yoeVal);
      if (internshipVal !== '') body.internship = internshipVal === 'true';

      try {
        const res = await fetch('http://localhost:8000/match', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });

        if (!res.ok) {
          const text = await res.text();
          throw new Error(`Server error ${res.status}: ${text}`);
        }

        const jobs = await res.json();
        statusEl.textContent = `${jobs.length} match${jobs.length !== 1 ? 'es' : ''} found.`;
        renderResults(jobs, body.explain_top_k);
      } catch (err) {
        statusEl.textContent = '';
        errorEl.textContent = err.message;
      } finally {
        submitBtn.disabled = false;
      }
    });

    function renderResults(jobs, explainLimit) {
      if (!jobs.length) {
        resultsEl.innerHTML = '<p style="color:#555;font-size:0.9rem">No matches found.</p>';
        return;
      }

      const fullJobs = jobs.slice(0, explainLimit);
      const compactJobs = jobs.slice(explainLimit);

      if (fullJobs.length) {
        const label = document.createElement('div');
        label.className = 'section-label';
        label.textContent = 'Top Matches';
        resultsEl.appendChild(label);

        fullJobs.forEach((job, i) => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div class="card-header">
              <div>
                <div class="card-title">${i + 1}. ${esc(job.title)}</div>
                <div class="card-company">${esc(job.company)}</div>
              </div>
              <div class="card-score">Score: ${job.score.toFixed(3)}</div>
            </div>
            <div class="card-url"><a href="${esc(job.url)}" target="_blank">${esc(job.url)}</a></div>
            ${job.explanation ? `<div class="card-explanation">${esc(job.explanation)}</div>` : ''}
            ${job.corpus_warning ? `<span class="corpus-warning">⚠ Limited job data — explanation may be less accurate</span>` : ''}
          `;
          resultsEl.appendChild(card);
        });
      }

      if (compactJobs.length) {
        const label = document.createElement('div');
        label.className = 'section-label';
        label.textContent = 'More Results';
        resultsEl.appendChild(label);

        compactJobs.forEach((job, i) => {
          const row = document.createElement('div');
          row.className = 'compact';
          row.innerHTML = `
            <span class="compact-title">${explainLimit + i + 1}. ${esc(job.title)}</span>
            <span class="compact-sep">·</span>
            <span class="compact-company">${esc(job.company)}</span>
            <span class="compact-sep">·</span>
            <span class="compact-url"><a href="${esc(job.url)}" target="_blank">View Job</a></span>
          `;
          resultsEl.appendChild(row);
        });
      }
    }

    function esc(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
